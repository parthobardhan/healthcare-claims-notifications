[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = 
    --cov=claims
    --cov=notify
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=85
