<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Adjuster Portal</title>
    <link rel="stylesheet" href="https://unpkg.com/antd@5/dist/reset.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.20.2/dist/reset.min.css" />
    <style>
      :root{ --uhg-navy:#002D62; --uhg-blue:#00A3E0; --uhg-gold:#B58500;}
      body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
      .uhg-toolbar{display:flex;gap:12px;align-items:center;height:56px;padding:0 16px;background:var(--uhg-navy);color:#fff;font-weight:600}
      .container{padding:16px}
      .muted{color:#666;font-size:12px}
      .status{ text-transform:capitalize; padding:2px 6px; border-radius:4px }
      .s-pending{ background:#fffbe6; color:#ad8b00 }
      .s-paid{ background:#f6ffed; color:#389e0d }
      .s-denied{ background:#fff1f0; color:#cf1322 }
      .s-adjudicated{ background:#e6f7ff; color:#096dd9 }
      .s-submitted{ background:#f0f5ff; color:#2f54eb }
      .form-grid{ display:grid; grid-template-columns: repeat(2,1fr); gap:12px }
      .form-grid label{ display:flex; flex-direction:column; gap:6px; font-weight:600 }
      .form-grid label.full{ grid-column:1 / -1 }
      .logo{width:36px;height:36px}
    </style>

    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/antd@5.20.2/dist/antd.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      function initApp() {
        const { useState, useEffect } = React;
        const { Table, Button, Input, Card, Typography, Space, message, Modal, Select } = antd;

        const API = {
          claims: (window.env && window.env.claimsApi) || 'http://localhost:8080',
          notify: (window.env && window.env.notifyApi) || 'http://localhost:8000'
        };

        const currency = (n) => (Number(n||0)).toLocaleString('en-US', { style:'currency', currency:'USD' });

        function Logo() {
          const svg = 'data:image/svg+xml;utf8,' + encodeURIComponent(
            '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">\n' +
            ' <rect width="100" height="100" rx="12" fill="#002D62"/>\n' +
            ' <text x="50%" y="58%" font-size="54" text-anchor="middle" fill="white" font-family="Arial,sans-serif">U</text>\n' +
            '</svg>'
          );
          return React.createElement('img', { className:'logo', src: svg, alt:'UHG' });
        }

        function App(){
          const [claims, setClaims] = useState([]);
          const [loading, setLoading] = useState(false);
          const [editing, setEditing] = useState(false);
          const [saving, setSaving] = useState(false);
          const [currentId, setCurrentId] = useState(null);
          const [form, setForm] = useState({
            member_id:'', provider_id:'', service_date:'', received_date:'',
            diagnosis_codes:'', procedure_codes:'', amount_billed:0, amount_allowed:0, amount_paid:0,
            status:'submitted', notes:''
          });

          const load = () => {
            setLoading(true);
            fetch(API.claims + '/claims').then(r=>r.json()).then(data=>{
              setClaims(data||[]);
              setLoading(false);
            }).catch(()=>{ message.error('Failed to load claims'); setLoading(false); });
          };

          useEffect(()=>{ load(); },[]);

          const columns = [
            { title:'Member', dataIndex:'member_id' },
            { title:'Provider', dataIndex:'provider_id' },
            { title:'Service', key:'svc', render:(_,c)=>(
              React.createElement('div', null,
                c.service_date,
                React.createElement('div', { className:'muted' }, 'Received: ' + c.received_date)
              )
            )},
            { title:'Status', key:'status', render:(_,c)=> React.createElement('span', { className:'status s-' + c.status }, c.status) },
            { title:'Amounts', key:'amts', render:(_,c)=> (
              React.createElement('div', null,
                'Billed: ' + currency(c.amount_billed),
                React.createElement('div', { className:'muted' }, 'Allowed: ' + currency(c.amount_allowed)),
                React.createElement('div', { className:'muted' }, 'Paid: ' + currency(c.amount_paid))
              )
            )},
            { title:'Actions', key:'act', render:(_,c)=> React.createElement(Button, { type:'link', onClick: ()=>openEdit(c) }, 'Edit') }
          ];

          const openEdit = (c) => {
            setCurrentId(c.id);
            setForm({
              member_id:c.member_id||'',
              provider_id:c.provider_id||'',
              service_date:c.service_date||'',
              received_date:c.received_date||'',
              diagnosis_codes:(c.diagnosis_codes||[]).join(', '),
              procedure_codes:(c.procedure_codes||[]).join(', '),
              amount_billed:c.amount_billed||0,
              amount_allowed:c.amount_allowed||0,
              amount_paid:c.amount_paid||0,
              status:c.status||'submitted',
              notes:c.notes||''
            });
            setEditing(true);
          };

          const save = async () => {
            if (!currentId) return;
            // basic validation
            if (!form.member_id || !form.provider_id || !form.service_date || !form.received_date) {
              message.warning('Please fill required fields');
              return;
            }
            setSaving(true);
            const payload = {
              member_id: form.member_id,
              provider_id: form.provider_id,
              service_date: form.service_date,
              received_date: form.received_date,
              diagnosis_codes: String(form.diagnosis_codes||'').split(',').map(s=>s.trim()).filter(Boolean),
              procedure_codes: String(form.procedure_codes||'').split(',').map(s=>s.trim()).filter(Boolean),
              amount_billed: Number(form.amount_billed||0),
              amount_allowed: Number(form.amount_allowed||0),
              amount_paid: Number(form.amount_paid||0),
              status: form.status,
              notes: form.notes
            };
            try {
              const res = await fetch(API.claims + '/claims/' + currentId, { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
              if (!res.ok) throw new Error('bad');
              const updated = await res.json();
              message.success('Claim updated');
              setEditing(false);
              setSaving(false);
              // Broadcast push notification
              try {
                await fetch(API.notify + '/notify', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
                  title:'Claim Updated', body:`Claim ${updated.id} is now ${updated.status}`, url:'/claims/' + updated.id
                })});
              } catch {}
              load();
            } catch(e) {
              message.error('Update failed');
              setSaving(false);
            }
          };

          return React.createElement('div', null,
            React.createElement('div', { className:'uhg-toolbar' },
              React.createElement(Logo, null),
              React.createElement('span', null, 'Claim Adjuster')
            ),
            React.createElement('div', { className:'container' },
              React.createElement(Typography.Title, { level:2 }, 'Claims'),
              React.createElement(Table, { rowKey:'id', dataSource:claims, loading:loading, columns:columns, pagination:false, bordered:true })
            ),
            React.createElement(Modal, {
              title:'Edit Claim', open: editing, onCancel: ()=>{ setEditing(false); setCurrentId(null); },
              onOk: save, confirmLoading: saving, maskClosable:false, width:720
            },
              React.createElement('div', { className:'form-grid' },
                React.createElement('label', null, 'Member ID', React.createElement(Input, { value:form.member_id, onChange:e=>setForm({...form, member_id:e.target.value}) })),
                React.createElement('label', null, 'Provider ID', React.createElement(Input, { value:form.provider_id, onChange:e=>setForm({...form, provider_id:e.target.value}) })),
                React.createElement('label', null, 'Service Date', React.createElement(Input, { type:'date', value:form.service_date, onChange:e=>setForm({...form, service_date:e.target.value}) })),
                React.createElement('label', null, 'Received Date', React.createElement(Input, { type:'date', value:form.received_date, onChange:e=>setForm({...form, received_date:e.target.value}) })),
                React.createElement('label', null, 'Diagnosis Codes', React.createElement(Input, { placeholder:'E.g. E11.9, I10', value:form.diagnosis_codes, onChange:e=>setForm({...form, diagnosis_codes:e.target.value}) })),
                React.createElement('label', null, 'Procedure Codes', React.createElement(Input, { placeholder:'E.g. 99213, 70450', value:form.procedure_codes, onChange:e=>setForm({...form, procedure_codes:e.target.value}) })),
                React.createElement('label', null, 'Amount Billed', React.createElement(Input, { type:'number', value:form.amount_billed, onChange:e=>setForm({...form, amount_billed:e.target.value}) })),
                React.createElement('label', null, 'Amount Allowed', React.createElement(Input, { type:'number', value:form.amount_allowed, onChange:e=>setForm({...form, amount_allowed:e.target.value}) })),
                React.createElement('label', null, 'Amount Paid', React.createElement(Input, { type:'number', value:form.amount_paid, onChange:e=>setForm({...form, amount_paid:e.target.value}) })),
                React.createElement('label', null, 'Status',
                  React.createElement(Select, { value:form.status, onChange:v=>setForm({...form, status:v}), style:{ width:'100%' }, options:[
                    { value:'submitted', label:'submitted' },
                    { value:'pending', label:'pending' },
                    { value:'adjudicated', label:'adjudicated' },
                    { value:'paid', label:'paid' },
                    { value:'denied', label:'denied' }
                  ]})
                ),
                React.createElement('label', { className:'full' }, 'Notes', React.createElement('textarea', { className:'ant-input', rows:3, value:form.notes, onChange:e=>setForm({...form, notes:e.target.value}) }))
              )
            )
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
      }

      (function ensureDepsAndStart(){
        function loadScript(src, onload, onerror){ const s=document.createElement('script'); s.src=src; s.async=true; s.onload=onload; s.onerror=onerror||(()=>{}); document.head.appendChild(s); }
        function start(){ try{ initApp(); } catch(e){ console.error('App init failed', e);} }
        function ensureAntd(){ if(window.antd){ start(); return; } loadScript('https://unpkg.com/antd@5.20.2/dist/antd.min.js', ()=> start()); }
        if(!window.dayjs){ loadScript('https://unpkg.com/dayjs@1/dayjs.min.js', ()=> ensureAntd(), ()=> ensureAntd()); } else { ensureAntd(); }
      })();
    </script>
  </body>
</html>
